name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run TypeScript checks
        run: npm run typecheck

      - name: Build extension
        run: npm run build

      # Future publishing must be a separate job with a protected GitHub
      # environment. Store real credentials in GitHub Actions secrets and refer
      # to them as ${{ secrets.SECRET_NAME }}; never commit tokens to this file.
